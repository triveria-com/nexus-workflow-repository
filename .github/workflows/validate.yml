name: Validate

# Runs the same build as the deploy, so a broken template or workflow file is
# reported on the pull request instead of failing the deploy on main.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate templates
        run: npm run validate

      - name: Build indexes
        run: npm run build
